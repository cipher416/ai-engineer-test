[project]
name = "ai-engineer-test"
version = "0.1.0"
description = "Streamlit receipt assistant, chunked CSV analysis and handwritten cosine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "pillow>=11,<13",
  "pandas>=3.0,<4",
  "langchain>=1.2,<2",
  "streamlit>=1.50,<2",
  "qdrant-client>=1.15,<2",
  "langchain-openrouter>=0.2.9,<1",
  "sqlalchemy>=2.1,<3",
]

[dependency-groups]
dev = [
 "ipykernel>=7.3.0",
 "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
